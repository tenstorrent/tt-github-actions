name: Test Vault GitHub token scripts

on:
  pull_request:
    paths:
      - .github/actions/vault-github-token/**
      - .github/workflows/test_vault_github_token.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Test validation, routing, and token retrieval without credentials
        run: python3 -m unittest discover -s .github/actions/vault-github-token/tests -v
      - name: Check shell scripts
        run: shellcheck .github/actions/vault-github-token/scripts/*.sh
